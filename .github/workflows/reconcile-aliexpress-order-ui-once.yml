name: Reconcile AliExpress order UI once

on:
  push:
    branches:
      - feat/aliexpress-open-platform-fulfillment
    paths:
      - .github/workflows/reconcile-aliexpress-order-ui-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aliexpress-open-platform-fulfillment
      - name: Wire order page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/orders/[id]/page.tsx')
          t=p.read_text()
          old='''import { OrderFulfillmentPanel } from "./order-fulfillment-panel";'''
          new='''import { OrderFulfillmentPanel } from "./order-fulfillment-panel";\nimport { AliExpressBatchPanel } from "./aliexpress-batch-panel";'''
          assert old in t
          t=t.replace(old,new,1)
          old='''    carrier: batch.carrier,\n    items: batch.items.map((item) => ({'''
          new='''    carrier: batch.carrier,\n    placementStatus: batch.placementStatus,\n    logisticsServiceName: batch.logisticsServiceName,\n    items: batch.items.map((item) => ({'''
          assert old in t
          t=t.replace(old,new,1)
          old='''            <OrderFulfillmentPanel\n              orderId={order.id}\n              fulfillmentStatus={order.fulfillmentStatus}\n              batches={batches}\n            />'''
          new='''            <OrderFulfillmentPanel\n              orderId={order.id}\n              fulfillmentStatus={order.fulfillmentStatus}\n              batches={batches}\n            />\n            <AliExpressBatchPanel orderId={order.id} batches={batches} />'''
          assert old in t
          p.write_text(t.replace(old,new,1))
          PY
      - name: Commit
        run: |
          rm .github/workflows/reconcile-aliexpress-order-ui-once.yml
          git config user.name "store-manager-bot"
          git config user.email "store-manager-bot@users.noreply.github.com"
          git add 'src/app/orders/[id]/page.tsx' .github/workflows/reconcile-aliexpress-order-ui-once.yml
          git commit -m "feat: expose automated AliExpress fulfillment controls"
          git push origin HEAD:feat/aliexpress-open-platform-fulfillment
