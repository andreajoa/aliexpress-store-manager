name: Count paid supplier snapshots as reservations once

on:
  push:
    branches:
      - feat/checkout-stock-reservations
    paths:
      - .github/workflows/reconcile-paid-snapshot-reservations-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/checkout-stock-reservations
      - name: Patch supplier availability and fulfillment reservation queries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/supplier-refresh-service.ts')
          t=p.read_text()
          old='''        fulfillmentSupplierVariantId: { not: null },\n        fulfillmentBatch: { status: { in: ["PROCESSING", "ORDERED"] } },'''
          new='''        fulfillmentSupplierVariantId: { not: null },\n        OR: [\n          { fulfillmentBatch: { status: { in: ["PROCESSING", "ORDERED"] } } },\n          {\n            fulfillmentBatchId: null,\n            order: {\n              paymentStatus: "PAID",\n              fulfillmentStatus: "UNFULFILLED",\n              status: "PAID",\n            },\n          },\n        ],'''
          assert old in t
          p.write_text(t.replace(old,new,1))

          p=Path('src/lib/order-fulfillment-service.ts')
          t=p.read_text()
          old='''      fulfillmentSupplierVariantId: { not: null },\n      fulfillmentBatch: { status: { in: ["PROCESSING", "ORDERED"] } },'''
          new='''      fulfillmentSupplierVariantId: { not: null },\n      OR: [\n        { fulfillmentBatch: { status: { in: ["PROCESSING", "ORDERED"] } } },\n        {\n          fulfillmentBatchId: null,\n          order: {\n            paymentStatus: "PAID",\n            fulfillmentStatus: "UNFULFILLED",\n            status: "PAID",\n          },\n        },\n      ],'''
          assert old in t
          t=t.replace(old,new,1)
          old2='''          fulfillmentSupplierVariantId: { in: [...quantities.keys()] },\n          fulfillmentBatch: { status: { in: ["PROCESSING", "ORDERED"] } },'''
          new2='''          fulfillmentSupplierVariantId: { in: [...quantities.keys()] },\n          OR: [\n            { fulfillmentBatch: { status: { in: ["PROCESSING", "ORDERED"] } } },\n            {\n              fulfillmentBatchId: null,\n              order: {\n                paymentStatus: "PAID",\n                fulfillmentStatus: "UNFULFILLED",\n                status: "PAID",\n              },\n            },\n          ],'''
          assert old2 in t
          p.write_text(t.replace(old2,new2,1))
          PY
      - name: Commit
        run: |
          rm .github/workflows/reconcile-paid-snapshot-reservations-once.yml
          git config user.name "store-manager-bot"
          git config user.email "store-manager-bot@users.noreply.github.com"
          git add src/lib/supplier-refresh-service.ts src/lib/order-fulfillment-service.ts .github/workflows/reconcile-paid-snapshot-reservations-once.yml
          git commit -m "feat: keep paid checkout supplier snapshots reserved"
          git push origin HEAD:feat/checkout-stock-reservations
