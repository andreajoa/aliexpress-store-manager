name: AliExpress MTOP Live Diagnostic

on:
  pull_request:
    paths:
      - "src/lib/aliexpress-mtop.ts"
      - "scripts/aliexpress-mtop-live-smoke.ts"
      - ".github/workflows/aliexpress-mtop-live-diagnostic.yml"

jobs:
  live-product:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live AliExpress SKU and stock probe
        run: node --no-warnings --experimental-strip-types scripts/aliexpress-mtop-live-smoke.ts
