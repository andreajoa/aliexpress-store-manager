name: FX Diagnostic

on:
  push:
    branches:
      - diagnostic/pricing-fx
  pull_request:
    branches:
      - main

jobs:
  fx:
    runs-on: ubuntu-24.04
    steps:
      - name: Test CNY to USD rate
        run: |
          set -euo pipefail
          echo "=== CNY/USD ==="
          curl --fail --silent --show-error --max-time 15 https://api.frankfurter.dev/v2/rate/CNY/USD
          echo
      - name: Probe production pricing context
        run: |
          set -euo pipefail
          echo "=== PRODUCTION PRICING CONTEXT ==="
          curl --silent --show-error --max-time 20 --include https://aliexpress-store-manager-six.vercel.app/api/products/cmsy2hk7a000004jrnf0s45x8/pricing-context
          echo
