name: Finalize official AliExpress import

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/import-timeout-bundled-chromium'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply final import patches
        run: |
          python - <<'PY'
          from pathlib import Path

          # Preserve exact order SKU attribute in the official operational product.
          p = Path('src/lib/aliexpress-official-product-provider.ts')
          s = p.read_text()
          marker = '    official_product_status: official.productStatus,\n    official_response: envelope,\n'
          replacement = '''    official_product_status: official.productStatus,\n    official_sku_attrs: Object.fromEntries(\n      official.skus.map((sku) => [sku.sourceSkuId, sku.orderSkuAttr]),\n    ),\n    official_response: envelope,\n'''
          if marker not in s:
              raise SystemExit('official provider return marker not found')
          p.write_text(s.replace(marker, replacement, 1))

          # Import operational data first. Editorial enrichment must never hold a paid/critical API request.
          p = Path('src/app/api/import/aliexpress/route.ts')
          s = p.read_text()
          s = s.replace('import { scrapeAliExpressProduct } from "@/lib/aliexpress";\n', '', 1)
          old = '''    // ScrapingBee é somente enriquecimento editorial. Nunca é fonte de SKU/estoque.\n    let enrichment:\n      | Awaited<ReturnType<typeof scrapeAliExpressProduct>>\n      | null = null;\n\n    try {\n      enrichment = await scrapeAliExpressProduct(requestedUrl);\n    } catch (error) {\n      console.warn("ScrapingBee enrichment skipped:", error);\n    }\n\n'''
          if old not in s:
              raise SystemExit('synchronous ScrapingBee block not found')
          s = s.replace(old, '    // Enriquecimento editorial é posterior e nunca bloqueia SKU/estoque.\n\n', 1)
          s = s.replace('      ...(enrichment?.images || []),\n', '', 1)
          s = s.replace('      sourceProduct.currency || enrichment?.currency || "USD"\n', '      sourceProduct.currency || "USD"\n', 1)
          s = s.replace('    const description = enrichment?.description || null;', '    const description = null;', 1)
          s = s.replace('            enrichmentSpecifications: enrichment?.specifications || [],', '            enrichmentSpecifications: [],', 1)
          s = s.replace('            shippingInfo: enrichment?.shippingInfo || "",', '            shippingInfo: "",', 1)
          s = s.replace('            stockInfo: enrichment?.stockInfo || "",', '            stockInfo: "",', 1)
          s = s.replace('''            scrapingBee: enrichment\n              ? JSON.parse(JSON.stringify(enrichment.raw))\n              : null,\n''', '            scrapingBee: null,\n', 1)

          map_marker = '''      const skuById = new Map(\n        skuPricing.map((sku) => [String(sku.sku_id), sku]),\n      );\n\n'''
          map_replacement = '''      const skuById = new Map(\n        skuPricing.map((sku) => [String(sku.sku_id), sku]),\n      );\n      const officialSkuAttrs = sourceProduct.official_sku_attrs &&\n        typeof sourceProduct.official_sku_attrs === "object" &&\n        !Array.isArray(sourceProduct.official_sku_attrs)\n        ? sourceProduct.official_sku_attrs as Record<string, string>\n        : {};\n\n'''
          if map_marker not in s:
              raise SystemExit('sku map marker not found')
          s = s.replace(map_marker, map_replacement, 1)

          supplier_marker = '''            sourceSkuId: canonicalVariant.sourceSkuId,\n            name: supplierVariantName(attributes, canonicalVariant.sourceSkuId),\n'''
          supplier_replacement = '''            sourceSkuId: canonicalVariant.sourceSkuId,\n            orderSkuAttr: officialSkuAttrs[canonicalVariant.sourceSkuId] || null,\n            name: supplierVariantName(attributes, canonicalVariant.sourceSkuId),\n'''
          if supplier_marker not in s:
              raise SystemExit('supplier variant marker not found')
          s = s.replace(supplier_marker, supplier_replacement, 1)

          if 'scrapeAliExpressProduct' in s or 'enrichment?.' in s:
              raise SystemExit('synchronous editorial enrichment remains')
          p.write_text(s)

          # Client: Vercel gateway errors can be plain text. Never blindly parse JSON.
          p = Path('src/app/products/import-form.tsx')
          s = p.read_text()
          old = '''      const data =\n        await response.json();\n'''
          new = '''      const rawBody = await response.text();\n      let data: { error?: string; product?: ImportedProduct } = {};\n\n      if (rawBody) {\n        try {\n          data = JSON.parse(rawBody) as typeof data;\n        } catch {\n          if (response.status === 504) {\n            throw new Error(\n              "A consulta ao fornecedor excedeu o tempo máximo. O produto não foi salvo.",\n            );\n          }\n          throw new Error(\n            `O servidor retornou uma resposta inválida (HTTP ${response.status}). O produto não foi salvo.`,\n          );\n        }\n      }\n'''
          if old not in s:
              raise SystemExit('response.json marker not found')
          s = s.replace(old, new, 1)
          old_set = '''      setProduct(\n        data.product\n      );\n'''
          new_set = '''      if (!data.product) {\n        throw new Error("A importação terminou sem retornar os dados do produto.");\n      }\n\n      setProduct(data.product);\n'''
          if old_set not in s:
              raise SystemExit('setProduct marker not found')
          s = s.replace(old_set, new_set, 1)
          p.write_text(s)

          # Fixture reproduces the official AliExpress DS shape with exact stock and order SKU attributes.
          Path('scripts/official-aliexpress-import-smoke.ts').write_text('''import { readFileSync } from "node:fs";\nimport { officialDropshipProductToOperationalProduct } from "../src/lib/aliexpress-official-product-provider.ts";\n\nfunction assert(v: unknown, m: string): asserts v { if (!v) throw new Error(m); }\n\nconst envelope = {\n  result: {\n    ae_item_base_info_dto: { product_id: "3256811750293175", subject: "Official Test Dress", currency_code: "USD", category_id: "200003482", product_status_type: "onSelling" },\n    ae_item_sku_info_dtos: {\n      ae_item_sku_info_d_t_o: [\n        { id: "14:193;5:100014064", sku_code: "SKU-BLACK-S", sku_available_stock: 7, offer_sale_price: "12.50", ae_sku_property_dtos: { ae_sku_property_d_t_o: [ { sku_property_id: 14, sku_property_name: "Color", property_value_definition_name: "Black" }, { sku_property_id: 5, sku_property_name: "Size", property_value_definition_name: "S" } ] } },\n        { id: "14:193;5:361386", sku_code: "SKU-BLACK-M", sku_available_stock: 3, offer_sale_price: "12.50", ae_sku_property_dtos: { ae_sku_property_d_t_o: [ { sku_property_id: 14, sku_property_name: "Color", property_value_definition_name: "Black" }, { sku_property_id: 5, sku_property_name: "Size", property_value_definition_name: "M" } ] } },\n      ],\n    },\n    ae_multimedia_info_dto: { image_urls: "https://ae01.alicdn.com/a.jpg;https://ae01.alicdn.com/b.jpg" },\n    ae_store_info: { store_id: "123", store_name: "Official Store" },\n    package_info_dto: { package_length: 20, package_width: 10, package_height: 5, gross_weight: 0.4 },\n  },\n};\n\nconst product = officialDropshipProductToOperationalProduct(envelope, "3256811750293175");\nassert(product.id === "3256811750293175", "wrong product id");\nassert(product.sku_pricing?.length === 2, "official SKUs were not converted");\nassert(product.sku_pricing?.[0]?.available_quantity === 7, "exact stock was not preserved");\nassert(product.sku_pricing?.[0]?.sale_price === 12.5, "exact price was not preserved");\nconst attrs = product.official_sku_attrs as Record<string,string>;\nassert(attrs["SKU-BLACK-S"] === "14:193;5:100014064", "order sku attr was not preserved");\n\nconst provider = readFileSync("src/lib/aliexpress-operational-provider.ts", "utf8");\nconst route = readFileSync("src/app/api/import/aliexpress/route.ts", "utf8");\nconst form = readFileSync("src/app/products/import-form.tsx", "utf8");\nassert(provider.includes("getOfficialProduct(productId)"), "official provider must be first path");\nassert(provider.includes("ALIEXPRESS_OPEN_PLATFORM"), "official provider label missing");\nassert(!provider.includes("getAliExpressBrowserProduct"), "browser cannot be synchronous operational fallback");\nassert(provider.includes("OMKAR_FAST_TIMEOUT_MS = 5000"), "Omkar fallback must fail fast");\nassert(!route.includes("scrapeAliExpressProduct"), "editorial ScrapingBee cannot block import");\nassert(route.includes("orderSkuAttr: officialSkuAttrs"), "supplier variant must persist official orderSkuAttr");\nassert(!form.includes("await response.json()"), "client cannot blindly parse gateway errors as JSON");\nassert(form.includes("response.status === 504"), "client must handle 504 explicitly");\nconsole.log("OFFICIAL ALIEXPRESS IMPORT: PASS");\n''')
          PY

      - run: npm ci
      - name: Official AliExpress import smoke
        run: node --no-warnings --experimental-strip-types scripts/official-aliexpress-import-smoke.ts
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          DIRECT_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npm run build

      - name: Commit validated final code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/official-import-fix-once.yml
          git add src/lib/aliexpress-official-product-provider.ts src/lib/aliexpress-operational-provider.ts src/app/api/import/aliexpress/route.ts src/app/products/import-form.tsx scripts/official-aliexpress-import-smoke.ts
          git commit -m "fix: use official AliExpress API for imports"
          git push origin HEAD:${{ github.head_ref }}
