name: Fix currency editor effects once

on:
  push:
    branches:
      - agent/web-export-and-market-currency
    paths:
      - .github/workflows/fix-currency-effects-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/web-export-and-market-currency

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch effects
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app/products/[id]/product-editor.tsx")
          text = path.read_text()

          old = '''  useEffect(() => {
            setOptimizedTitle(props.optimizedTitle);
            setHeadline(props.headline);
            setShortDescription(props.shortDescription);
            setBenefits(props.benefits.join("\\n"));
            setCta(props.cta);
            setSeoTitle(props.seoTitle);
            setSeoDescription(props.seoDescription);
            setCompareAtPrice(props.compareAtPrice || "");
            setPrices(initialPrices(props.variants));
            setSelectedImages(
              new Set(
                props.images
                  .filter((image) => image.selected)
                  .map((image) => image.id)
              )
            );
          }, ['''
          new = '''  useEffect(() => {
            const timer = window.setTimeout(() => {
              setOptimizedTitle(props.optimizedTitle);
              setHeadline(props.headline);
              setShortDescription(props.shortDescription);
              setBenefits(props.benefits.join("\\n"));
              setCta(props.cta);
              setSeoTitle(props.seoTitle);
              setSeoDescription(props.seoDescription);
              setCompareAtPrice(props.compareAtPrice || "");
              setPrices(initialPrices(props.variants));
              setSelectedImages(
                new Set(
                  props.images
                    .filter((image) => image.selected)
                    .map((image) => image.id)
                )
              );
            }, 0);

            return () => window.clearTimeout(timer);
          }, ['''
          if old not in text:
              raise SystemExit("sync props effect anchor missing")
          text = text.replace(old, new, 1)

          old = '''    let active = true;
            setCurrencyLoading(true);

            fetch('''
          new = '''    let active = true;

            fetch('''
          if old not in text:
              raise SystemExit("currency loading effect anchor missing")
          text = text.replace(old, new, 1)

          old = '''    let active = true;
            setFxRate(null);
            setFxDate(null);

            fetch('''
          new = '''    let active = true;

            fetch('''
          if old not in text:
              raise SystemExit("FX reset effect anchor missing")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - run: npm ci
      - run: npm run lint
      - run: npm run test:web-export-currency
      - run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-currency-effects-once.yml
          git add -A
          git commit -m "fix: satisfy React effect lint in currency editor"
          git push origin HEAD:agent/web-export-and-market-currency
