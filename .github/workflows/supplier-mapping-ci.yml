name: Supplier Mapping CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma schema
        run: |
          npx prisma validate
          npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Supplier variant mapper
        run: node --no-warnings --experimental-strip-types scripts/supplier-variant-mapper-smoke.ts
      - name: Existing publication target regression
        run: npm run test:publication-target
      - name: Existing publication executor regression
        run: npm run test:github-publication
      - name: Build
        run: npm run build
