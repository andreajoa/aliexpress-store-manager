name: Admin Auth Final Gate Once

on:
  push:
    branches:
      - feat/manager-admin-auth
    paths:
      - .github/workflows/admin-auth-final-gate-once.yml

permissions:
  contents: write

jobs:
  gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/store_manager_ci
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/store_manager_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manager-admin-auth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: node --no-warnings --experimental-strip-types scripts/manager-admin-auth-smoke.ts
      - run: npm run test:publication-target
      - run: npm run test:github-publication
      - run: node --no-warnings --experimental-strip-types scripts/order-ingestion-smoke.ts
      - run: npm run lint
      - run: npm run build
      - name: Record immutable gate result
        run: |
          mkdir -p .quality-gates
          printf '%s\n' 'ADMIN_AUTH_FINAL_GATE=PASS' > .quality-gates/admin-auth.pass
          printf '%s\n' 'NODE=22' >> .quality-gates/admin-auth.pass
          rm .github/workflows/admin-auth-final-gate-once.yml
          git config user.name "store-manager-bot"
          git config user.email "store-manager-bot@users.noreply.github.com"
          git add .quality-gates/admin-auth.pass .github/workflows/admin-auth-final-gate-once.yml
          git commit -m "ci: record admin auth final gate"
          git push origin HEAD:feat/manager-admin-auth
