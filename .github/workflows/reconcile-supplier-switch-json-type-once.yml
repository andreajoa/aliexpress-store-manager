name: Reconcile supplier switch JSON typing once

on:
  push:
    branches:
      - feat/aliexpress-open-platform-fulfillment
    paths:
      - .github/workflows/reconcile-supplier-switch-json-type-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aliexpress-open-platform-fulfillment
      - name: Narrow audit payload type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/fulfillment-supplier-switch.ts')
          t=p.read_text()
          old='''    const itemAudit: Array<Record<string, unknown>> = [];'''
          new='''    const itemAudit: Array<{\n      orderItemId: string;\n      canonicalVariantId: string;\n      fromSupplierVariantId: string | null;\n      toSupplierVariantId: string;\n      toSourceSkuId: string;\n    }> = [];'''
          assert old in t
          p.write_text(t.replace(old,new,1))
          PY
      - name: Commit
        run: |
          rm .github/workflows/reconcile-supplier-switch-json-type-once.yml
          git config user.name "store-manager-bot"
          git config user.email "store-manager-bot@users.noreply.github.com"
          git add src/lib/fulfillment-supplier-switch.ts .github/workflows/reconcile-supplier-switch-json-type-once.yml
          git commit -m "fix: narrow supplier switch audit payload for Prisma JSON"
          git push origin HEAD:feat/aliexpress-open-platform-fulfillment
