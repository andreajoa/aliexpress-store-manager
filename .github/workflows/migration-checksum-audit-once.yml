name: Migration Checksum Audit Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migration-checksum-audit-once.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record pending migration checksums
        run: |
          mkdir -p .quality-gates
          sha256sum prisma/migrations/20260808175500_add_supplier_mapping/migration.sql > .quality-gates/pending-migration-checksums.txt
          sha256sum prisma/migrations/20260808182500_add_order_webhook_and_fulfillment/migration.sql >> .quality-gates/pending-migration-checksums.txt
          sha256sum prisma/migrations/20260808184000_add_fulfillment_batches/migration.sql >> .quality-gates/pending-migration-checksums.txt
          sha256sum prisma/migrations/20260808190000_add_managed_order_scope/migration.sql >> .quality-gates/pending-migration-checksums.txt
          sha256sum prisma/migrations/20260808193000_add_editorial_persistent_content/migration.sql >> .quality-gates/pending-migration-checksums.txt
          sha256sum prisma/migrations/20260808193500_add_editorial_binary_store/migration.sql >> .quality-gates/pending-migration-checksums.txt
      - name: Commit audit result and remove workflow
        run: |
          rm .github/workflows/migration-checksum-audit-once.yml
          git config user.name "store-manager-bot"
          git config user.email "store-manager-bot@users.noreply.github.com"
          git add .quality-gates/pending-migration-checksums.txt .github/workflows/migration-checksum-audit-once.yml
          git commit -m "chore: record pending migration checksums"
          git push origin HEAD:main
