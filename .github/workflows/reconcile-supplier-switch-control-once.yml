name: Restore supplier switch control once

on:
  push:
    branches:
      - feat/aliexpress-open-platform-fulfillment
    paths:
      - .github/workflows/reconcile-supplier-switch-control-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aliexpress-open-platform-fulfillment
      - name: Restore control in PROCESSING batch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/orders/[id]/order-fulfillment-panel.tsx')
          t=p.read_text()
          old='''import { useState } from "react";'''
          new='''import { useState } from "react";\n\nimport { SupplierSwitchControl } from "./supplier-switch-control";'''
          assert old in t
          t=t.replace(old,new,1)
          old='''      {batch.status === "PROCESSING" && (\n        <div className="mt-4 border-t border-zinc-800 pt-4">'''
          new='''      {batch.status === "PROCESSING" && (\n        <div className="mt-4">\n          <SupplierSwitchControl orderId={orderId} batchId={batch.id} />\n        </div>\n      )}\n\n      {batch.status === "PROCESSING" && (\n        <div className="mt-4 border-t border-zinc-800 pt-4">'''
          assert old in t
          p.write_text(t.replace(old,new,1))
          PY
      - name: Commit
        run: |
          rm .github/workflows/reconcile-supplier-switch-control-once.yml
          git config user.name "store-manager-bot"
          git config user.email "store-manager-bot@users.noreply.github.com"
          git add 'src/app/orders/[id]/order-fulfillment-panel.tsx' .github/workflows/reconcile-supplier-switch-control-once.yml
          git commit -m "fix: restore supplier switch control before purchase"
          git push origin HEAD:feat/aliexpress-open-platform-fulfillment
