name: Supplier Switch Final Gate Once

on:
  push:
    branches:
      - feat/fulfillment-supplier-switch
    paths:
      - .github/workflows/supplier-switch-final-gate-once.yml

permissions:
  contents: write

jobs:
  gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/store_manager_ci
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/store_manager_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fulfillment-supplier-switch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: node --no-warnings --experimental-strip-types scripts/supplier-variant-mapper-smoke.ts
      - run: node --no-warnings --experimental-strip-types scripts/supplier-selection-smoke.ts
      - run: node --no-warnings --experimental-strip-types scripts/order-ingestion-smoke.ts
      - run: npm run test:github-publication
      - name: Verify UI and audit wiring
        run: |
          grep -Fq 'SupplierSwitchControl' 'src/app/orders/[id]/order-fulfillment-panel.tsx'
          grep -Fq 'fulfillment.supplier_switched' src/lib/fulfillment-supplier-switch.ts
          grep -Fq 'SUPPLIER_SWITCH_V1' src/lib/fulfillment-supplier-switch.ts
      - run: npm run lint
      - run: npm run build
      - name: Record immutable gate result
        run: |
          mkdir -p .quality-gates
          printf '%s\n' 'SUPPLIER_SWITCH_FINAL_GATE=PASS' > .quality-gates/supplier-switch.pass
          rm .github/workflows/supplier-switch-final-gate-once.yml
          git config user.name "store-manager-bot"
          git config user.email "store-manager-bot@users.noreply.github.com"
          git add .quality-gates/supplier-switch.pass .github/workflows/supplier-switch-final-gate-once.yml
          git commit -m "ci: record supplier switch final gate"
          git push origin HEAD:feat/fulfillment-supplier-switch
