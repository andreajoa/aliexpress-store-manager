name: Reconcile AliExpress placement lock once

on:
  push:
    branches:
      - feat/aliexpress-open-platform-fulfillment
    paths:
      - .github/workflows/reconcile-aliexpress-placement-lock-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aliexpress-open-platform-fulfillment
      - name: Add placement fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prisma/schema.prisma')
          t=p.read_text()
          old='''  carrier         String?\n  logisticsServiceName String?\n\n  items'''
          new='''  carrier                String?\n  logisticsServiceName String?\n  placementStatus        String?\n  placementAttemptId     String?\n  placementStartedAt     DateTime?\n  placementLastError     String? @db.Text\n\n  items'''
          assert old in t
          p.write_text(t.replace(old,new,1))
          PY
      - name: Commit
        run: |
          rm .github/workflows/reconcile-aliexpress-placement-lock-once.yml
          git config user.name "store-manager-bot"
          git config user.email "store-manager-bot@users.noreply.github.com"
          git add prisma/schema.prisma .github/workflows/reconcile-aliexpress-placement-lock-once.yml
          git commit -m "feat: guard AliExpress order placement attempts"
          git push origin HEAD:feat/aliexpress-open-platform-fulfillment
