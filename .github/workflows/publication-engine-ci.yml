name: Publication Engine CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Store compatibility
        run: npm run test:store-compatibility

      - name: Publication target contract
        run: npm run test:publication-target

      - name: Repository dry-run
        run: npm run test:repository-dry-run

      - name: GitHub publication executor
        run: npm run test:github-publication
