# trigger
name: Patch pricing button

on:
  push:
    branches:
      - fix/pricing-button-on-demand

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pricing-button-on-demand
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch ProductEditor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/products/[id]/product-editor.tsx')
          text = path.read_text()

          state_marker = '  const [approving, setApproving] =\n    useState(false);\n'
          if state_marker not in text:
              raise SystemExit('approving state marker not found')
          text = text.replace(
              state_marker,
              state_marker + '  const [calculating, setCalculating] =\n    useState(false);\n',
              1,
          )

          start_marker = '  function calculateSuggestions() {'
          end_marker = '\n  async function saveDraft() {'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('calculateSuggestions block not found')

          new_function = r'''  async function calculateSuggestions() {
    setCalculating(true);
    setError("");
    setMessage("");

    try {
      const multiplierValue = Number(
        multiplier.replace(",", ".")
      );
      const reserveValue = Number(
        reserve.replace(",", ".")
      );

      if (
        !Number.isFinite(multiplierValue) ||
        multiplierValue <= 0
      ) {
        throw new Error("Informe um multiplicador válido.");
      }

      if (
        !Number.isFinite(reserveValue) ||
        reserveValue < 0
      ) {
        throw new Error(
          "Informe uma reserva percentual válida."
        );
      }

      const eligibleVariants = props.variants.filter(
        (variant) =>
          variant.available &&
          (variant.stock === null || variant.stock > 0)
      );

      if (eligibleVariants.length === 0) {
        throw new Error(
          "Não há variantes disponíveis para precificar."
        );
      }

      const response = await fetch(
        `/api/products/${props.productId}/pricing-context`,
        {
          cache: "no-store",
          credentials: "same-origin",
        }
      );
      const raw = await response.text();
      let data: Record<string, unknown> = {};

      try {
        data = raw
          ? JSON.parse(raw) as Record<string, unknown>
          : {};
      } catch {
        throw new Error(
          response.status === 401
            ? "A sessão administrativa não foi reutilizada pela consulta de precificação. Atualize a página e autentique novamente."
            : "A consulta de precificação retornou uma resposta inválida."
        );
      }

      if (!response.ok) {
        throw new Error(
          typeof data.error === "string"
            ? data.error
            : `Não foi possível carregar as cotações de precificação (HTTP ${response.status}).`
        );
      }

      const effectiveStoreCurrency =
        typeof data.storeCurrency === "string" && data.storeCurrency.trim()
          ? data.storeCurrency.trim().toUpperCase()
          : storeCurrency;
      const effectiveRates: Record<string, PricingRate> = {};
      const rawRates = data.rates;

      if (
        rawRates &&
        typeof rawRates === "object" &&
        !Array.isArray(rawRates)
      ) {
        for (const [currency, value] of Object.entries(
          rawRates as Record<string, unknown>
        )) {
          if (
            !value ||
            typeof value !== "object" ||
            Array.isArray(value)
          ) {
            continue;
          }

          const record = value as Record<string, unknown>;
          const rate = Number(record.rate);
          if (!Number.isFinite(rate) || rate <= 0) continue;

          effectiveRates[currency.toUpperCase()] = {
            rate,
            date:
              typeof record.date === "string"
                ? record.date
                : null,
          };
        }
      }

      setStoreCurrency(effectiveStoreCurrency);
      setPricingRates(effectiveRates);
      setCurrencyLoading(false);

      const next = { ...prices };

      for (const variant of eligibleVariants) {
        if (!variant.costPrice) {
          throw new Error(
            `A variante ${variant.sourceSkuId} está sem custo do fornecedor.`
          );
        }
        if (!variant.sourceCurrency) {
          throw new Error(
            `A variante ${variant.sourceSkuId} está sem moeda do fornecedor.`
          );
        }

        const sourceCurrency =
          variant.sourceCurrency.toUpperCase();
        const rate =
          sourceCurrency === effectiveStoreCurrency
            ? 1
            : effectiveRates[sourceCurrency]?.rate;

        const result = calculateSaleSuggestion({
          cost: Number(variant.costPrice),
          sourceCurrency,
          sellingCurrency: effectiveStoreCurrency,
          rate,
          multiplier: multiplierValue,
          reservePercent: reserveValue,
          ending,
        });

        next[variant.id] = inputMoney(
          result.suggestedPrice,
          effectiveStoreCurrency
        );
      }

      setPrices(next);
      setMessage(
        `${eligibleVariants.length} preço(s) final(is) calculado(s) em ${effectiveStoreCurrency}. Salve a revisão ou aprove o produto para gravar os valores.`
      );
    } catch (err) {
      setError(
        err instanceof Error
          ? err.message
          : "Não foi possível calcular os preços de venda."
      );
    } finally {
      setCalculating(false);
    }
  }
'''

          text = text[:start] + new_function + text[end:]

          click_marker = '            onClick={calculateSuggestions}\n            disabled={currencyLoading}'
          if click_marker not in text:
              raise SystemExit('pricing button disabled marker not found')
          text = text.replace(
              click_marker,
              '            onClick={calculateSuggestions}\n            disabled={calculating}',
              1,
          )

          label_marker = '>\n            Calcular sugestões\n          </button>'
          if label_marker not in text:
              raise SystemExit('pricing button label marker not found')
          text = text.replace(
              label_marker,
              '>\n            {calculating ? "Calculando..." : "Calcular sugestões"}\n          </button>',
              1,
          )

          busy_marker = '  const busy = loading || approving;'
          if busy_marker not in text:
              raise SystemExit('busy marker not found')
          text = text.replace(
              busy_marker,
              '  const busy = loading || approving || calculating;',
              1,
          )

          path.write_text(text)
          PY

          rm .github/workflows/patch-pricing-button.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make pricing suggestions load rates on demand"
          git push origin HEAD:fix/pricing-button-on-demand
