name: Reconcile Supplier Schema Once

on:
  push:
    branches:
      - feat/supplier-mapping-core

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supplier-mapping-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add supplier models safely
        run: |
          node -e 'const fs=require("fs"); const p="prisma/schema.prisma"; let s=fs.readFileSync(p,"utf8"); if(s.includes("model SupplierProduct {")){console.log("supplier schema already present");process.exit(0)} const marker="  publications Publication[]"; if(!s.includes(marker)) throw new Error("Product publications marker not found"); s=s.replace(marker,marker+"\n  supplierProducts SupplierProduct[]"); s += `\n\nenum SupplierRole {\n  PRIMARY\n  BACKUP\n  ALTERNATIVE\n}\n\nenum SupplierMappingMethod {\n  AUTO\n  MANUAL\n}\n\nmodel SupplierProduct {\n  id String @id @default(cuid())\n\n  productId String\n  product Product @relation(fields: [productId], references: [id], onDelete: Cascade)\n\n  provider String @default(\"ALIEXPRESS\")\n  sourceProductId String\n  sourceUrl String @db.Text\n  sellerId String?\n  sellerName String?\n\n  role SupplierRole @default(ALTERNATIVE)\n  priority Int @default(100)\n  status String @default(\"ACTIVE\")\n\n  sourceCurrency String?\n  costMin Decimal? @db.Decimal(12, 2)\n  costMax Decimal? @db.Decimal(12, 2)\n  rawPayload Json?\n  lastCheckedAt DateTime?\n\n  variants SupplierVariant[]\n  mappings SupplierVariantMapping[]\n\n  createdAt DateTime @default(now())\n  updatedAt DateTime @updatedAt\n\n  @@unique([productId, provider, sourceProductId])\n  @@index([productId, role])\n  @@index([status])\n}\n\nmodel SupplierVariant {\n  id String @id @default(cuid())\n\n  supplierProductId String\n  supplierProduct SupplierProduct @relation(fields: [supplierProductId], references: [id], onDelete: Cascade)\n\n  sourceSkuId String\n  name String\n  sourcePrice Decimal? @db.Decimal(12, 2)\n  stock Int @default(0)\n  attributes Json?\n  imageUrl String? @db.Text\n\n  mappings SupplierVariantMapping[]\n\n  createdAt DateTime @default(now())\n  updatedAt DateTime @updatedAt\n\n  @@unique([supplierProductId, sourceSkuId])\n  @@index([supplierProductId, stock])\n}\n\nmodel SupplierVariantMapping {\n  id String @id @default(cuid())\n\n  supplierProductId String\n  supplierProduct SupplierProduct @relation(fields: [supplierProductId], references: [id], onDelete: Cascade)\n\n  supplierVariantId String\n  supplierVariant SupplierVariant @relation(fields: [supplierVariantId], references: [id], onDelete: Cascade)\n\n  canonicalVariantId String\n  confidence Decimal? @db.Decimal(5, 4)\n  method SupplierMappingMethod @default(MANUAL)\n  evidence Json?\n  active Boolean @default(true)\n  verifiedAt DateTime?\n\n  createdAt DateTime @default(now())\n  updatedAt DateTime @updatedAt\n\n  @@unique([supplierProductId, canonicalVariantId])\n  @@unique([supplierProductId, supplierVariantId])\n  @@index([canonicalVariantId, active])\n}\n`; fs.writeFileSync(p,s)'
      - name: Add migration
        run: |
          mkdir -p prisma/migrations/20260808170000_add_supplier_mapping
          printf '%s\n' 'CREATE TYPE "SupplierRole" AS ENUM ('"'"'PRIMARY'"'"', '"'"'BACKUP'"'"', '"'"'ALTERNATIVE'"'"');' > prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'CREATE TYPE "SupplierMappingMethod" AS ENUM ('"'"'AUTO'"'"', '"'"'MANUAL'"'"');' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'CREATE TABLE "SupplierProduct" ("id" TEXT NOT NULL, "productId" TEXT NOT NULL, "provider" TEXT NOT NULL DEFAULT '"'"'ALIEXPRESS'"'"', "sourceProductId" TEXT NOT NULL, "sourceUrl" TEXT NOT NULL, "sellerId" TEXT, "sellerName" TEXT, "role" "SupplierRole" NOT NULL DEFAULT '"'"'ALTERNATIVE'"'"', "priority" INTEGER NOT NULL DEFAULT 100, "status" TEXT NOT NULL DEFAULT '"'"'ACTIVE'"'"', "sourceCurrency" TEXT, "costMin" DECIMAL(12,2), "costMax" DECIMAL(12,2), "rawPayload" JSONB, "lastCheckedAt" TIMESTAMP(3), "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, "updatedAt" TIMESTAMP(3) NOT NULL, CONSTRAINT "SupplierProduct_pkey" PRIMARY KEY ("id"));' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'CREATE TABLE "SupplierVariant" ("id" TEXT NOT NULL, "supplierProductId" TEXT NOT NULL, "sourceSkuId" TEXT NOT NULL, "name" TEXT NOT NULL, "sourcePrice" DECIMAL(12,2), "stock" INTEGER NOT NULL DEFAULT 0, "attributes" JSONB, "imageUrl" TEXT, "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, "updatedAt" TIMESTAMP(3) NOT NULL, CONSTRAINT "SupplierVariant_pkey" PRIMARY KEY ("id"));' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'CREATE TABLE "SupplierVariantMapping" ("id" TEXT NOT NULL, "supplierProductId" TEXT NOT NULL, "supplierVariantId" TEXT NOT NULL, "canonicalVariantId" TEXT NOT NULL, "confidence" DECIMAL(5,4), "method" "SupplierMappingMethod" NOT NULL DEFAULT '"'"'MANUAL'"'"', "evidence" JSONB, "active" BOOLEAN NOT NULL DEFAULT true, "verifiedAt" TIMESTAMP(3), "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, "updatedAt" TIMESTAMP(3) NOT NULL, CONSTRAINT "SupplierVariantMapping_pkey" PRIMARY KEY ("id"));' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'CREATE UNIQUE INDEX "SupplierProduct_productId_provider_sourceProductId_key" ON "SupplierProduct"("productId", "provider", "sourceProductId");' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'CREATE INDEX "SupplierProduct_productId_role_idx" ON "SupplierProduct"("productId", "role");' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'CREATE INDEX "SupplierProduct_status_idx" ON "SupplierProduct"("status");' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'CREATE UNIQUE INDEX "SupplierVariant_supplierProductId_sourceSkuId_key" ON "SupplierVariant"("supplierProductId", "sourceSkuId");' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'CREATE INDEX "SupplierVariant_supplierProductId_stock_idx" ON "SupplierVariant"("supplierProductId", "stock");' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'CREATE UNIQUE INDEX "SupplierVariantMapping_supplierProductId_canonicalVariantId_key" ON "SupplierVariantMapping"("supplierProductId", "canonicalVariantId");' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'CREATE UNIQUE INDEX "SupplierVariantMapping_supplierProductId_supplierVariantId_key" ON "SupplierVariantMapping"("supplierProductId", "supplierVariantId");' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'CREATE INDEX "SupplierVariantMapping_canonicalVariantId_active_idx" ON "SupplierVariantMapping"("canonicalVariantId", "active");' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'ALTER TABLE "SupplierProduct" ADD CONSTRAINT "SupplierProduct_productId_fkey" FOREIGN KEY ("productId") REFERENCES "Product"("id") ON DELETE CASCADE ON UPDATE CASCADE;' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'ALTER TABLE "SupplierVariant" ADD CONSTRAINT "SupplierVariant_supplierProductId_fkey" FOREIGN KEY ("supplierProductId") REFERENCES "SupplierProduct"("id") ON DELETE CASCADE ON UPDATE CASCADE;' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'ALTER TABLE "SupplierVariantMapping" ADD CONSTRAINT "SupplierVariantMapping_supplierProductId_fkey" FOREIGN KEY ("supplierProductId") REFERENCES "SupplierProduct"("id") ON DELETE CASCADE ON UPDATE CASCADE;' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
          printf '%s\n' 'ALTER TABLE "SupplierVariantMapping" ADD CONSTRAINT "SupplierVariantMapping_supplierVariantId_fkey" FOREIGN KEY ("supplierVariantId") REFERENCES "SupplierVariant"("id") ON DELETE CASCADE ON UPDATE CASCADE;' >> prisma/migrations/20260808170000_add_supplier_mapping/migration.sql
      - name: Validate Prisma schema
        run: |
          npm ci
          npx prisma validate
          npx prisma generate
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/reconcile-supplier-schema-once.yml
          git config user.name "store-manager-bot"
          git config user.email "store-manager-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add persistent supplier mapping schema"
          git push origin HEAD:feat/supplier-mapping-core
